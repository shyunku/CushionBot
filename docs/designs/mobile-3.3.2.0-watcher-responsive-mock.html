<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>watcher 모바일 시안 (mobile 3.3.2.0)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: #2a2c31; color: #222; display: flex; gap: 16px; padding: 16px; align-items: flex-start;
    overflow: hidden;
  }

  /* ---------- app frame (real size) ---------- */
  #app {
    width: 390px; height: 844px; flex: 0 0 auto; border-radius: 18px; position: relative; overflow: hidden;
    background: var(--bg); color: var(--text); display: flex; font-size: 13px;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  #app[data-theme="old"]     { --bg:#0d0d0d; --panel:#000; --panel2:#303030; --panelSel:#1f4238; --line:#484848; --text:#c2c2c2; --strong:#fff; --muted:#7a7a7a; --accent:#44e7a3; --accent2:#39af8a; --title:#7bcebc; --now:#c93030; --barS:42%; --barL:34%; --grid:rgba(255,255,255,.08); }
  #app[data-theme="slate"]   { --bg:#0e1116; --panel:#11151c; --panel2:#181e28; --panelSel:#1a2a2a; --line:#232b38; --text:#a9b3c2; --strong:#e9eef5; --muted:#6b7686; --accent:#3ddc97; --accent2:#2bb37a; --title:#e9eef5; --now:#ff5c5c; --barS:48%; --barL:40%; --grid:rgba(255,255,255,.06); }
  #app[data-theme="discord"] { --bg:#313338; --panel:#2b2d31; --panel2:#232428; --panelSel:#3a3c74; --line:#3f4147; --text:#b5bac1; --strong:#f2f3f5; --muted:#80848e; --accent:#7c86ff; --accent2:#5865f2; --title:#f2f3f5; --now:#f23f43; --barS:45%; --barL:45%; --grid:rgba(255,255,255,.06); }
  #app[data-theme="light"]   { --bg:#f5f6f8; --panel:#ffffff; --panel2:#eef1f5; --panelSel:#e3f6ee; --line:#dde2e8; --text:#4a5361; --strong:#111827; --muted:#8a93a1; --accent:#0e9f6e; --accent2:#0b8a5f; --title:#111827; --now:#e5484d; --barS:58%; --barL:68%; --grid:rgba(0,0,0,.06); }

  button { font: inherit; color: inherit; }
  .btn { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .btn:hover { color: var(--strong); }
  #app[data-theme="old"] .btn { background:#000; border-color:#7a7a7a; color:#7a7a7a; border-radius:3px; padding:3px 5px; }
  #app[data-theme="old"] .btn.sel { border-color: var(--accent); color: var(--accent); }

  /* sidebar (old) */
  .sidebar { width: 280px; flex: 0 0 auto; background: var(--panel); border-right: 1px solid var(--line); padding: 20px; display:flex; flex-direction:column; }
  .sidebar .logo { color: var(--accent); font-size: 16px; font-weight: 700; margin-bottom: 15px; }
  .scard { background: var(--panel2); border: 1px solid transparent; border-radius: 6px; padding: 8px; margin-bottom: 10px; cursor: pointer; opacity: .45; }
  .scard.sel, .scard:hover { background: var(--panelSel); border-color: var(--accent2); opacity: 1; }
  .scard .h { display:flex; align-items:center; gap:8px; color: var(--strong); font-weight: 700; font-size: 14px; }
  .scard img, .rail img, .tab img { width: 24px; height: 24px; border-radius: 6px; }
  .scard svg { display:block; margin-top: 6px; }

  /* rail */
  .rail { width: 72px; flex: 0 0 auto; background: var(--panel); border-right: 1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding: 14px 0; gap: 10px; }
  .rail .logo { width: 44px; height: 44px; border-radius: 14px; background: var(--accent2); color: #fff; display:flex; align-items:center; justify-content:center; font-weight: 800; font-size: 18px; margin-bottom: 6px; }
  .rail .sep { width: 32px; height: 1px; background: var(--line); }
  .rail .srv { position: relative; cursor: pointer; }
  .rail .srv img { width: 44px; height: 44px; border-radius: 22px; transition: border-radius .15s; display:block; }
  .rail .srv.sel img, .rail .srv:hover img { border-radius: 14px; }
  .rail .srv.sel::before { content:""; position:absolute; left:-14px; top: 8px; width: 4px; height: 28px; border-radius: 0 4px 4px 0; background: var(--strong); }
  .rail .srv .live { position:absolute; right:-2px; bottom:-2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent2); color:#fff; font-size: 10px; font-weight: 700; display:flex; align-items:center; justify-content:center; border: 3px solid var(--panel); }

  /* tabs */
  .tabs { display:flex; gap: 6px; padding: 12px 20px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
  .tabs .logo { font-weight: 800; color: var(--accent); margin-right: 14px; align-self: center; padding-bottom: 10px; }
  .tab { display:flex; align-items:center; gap: 8px; padding: 8px 14px 10px; cursor:pointer; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab.sel { color: var(--strong); border-color: var(--accent); }
  .tab img { width: 20px; height: 20px; }

  .main { flex: 1; display:flex; flex-direction:column; min-width: 0; }
  .content { flex: 1; display:flex; flex-direction:column; padding: 18px 22px; min-height: 0; gap: 12px; position: relative; }

  /* header */
  .head { display:flex; align-items:center; gap: 12px; }
  .head .title { font-size: 22px; font-weight: 800; color: var(--title); display:flex; align-items:center; gap: 10px; }
  .head .title img { width: 32px; height: 32px; border-radius: 10px; }
  .head .meta { color: var(--muted); font-size: 12px; }
  .head .spark { margin-left: auto; display:flex; align-items:center; gap: 8px; color: var(--muted); font-size: 12px; }
  .oldtitle { font-size: 28px; font-weight: 700; color: var(--title); cursor: pointer; }
  .oldtitle:hover { opacity: .8; }
  .sharebtn { display:inline-flex; align-items:center; gap: 6px; }

  /* summary */
  .summary { display:grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { color: var(--strong); font-size: 20px; font-weight: 800; margin-top: 2px; display:flex; align-items:center; gap: 8px; }
  .stat .v img { width: 22px; height: 22px; border-radius: 11px; }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 8px var(--accent); display:inline-block; }

  /* now online chips */
  .nowstrip { display:flex; align-items:center; gap: 8px; flex-wrap: wrap; }
  .nowstrip .lbl { color: var(--muted); font-size: 12px; margin-right: 2px; display:flex; align-items:center; gap: 6px; }
  .chip { display:flex; align-items:center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 4px; }
  .chip .cdot { width: 18px; height: 18px; border-radius: 9px; }
  .chip .avs { display:flex; }
  .chip .avs img { width: 18px; height: 18px; border-radius: 9px; border: 2px solid var(--panel); margin-left: -5px; }
  .chip b { color: var(--strong); font-weight: 600; }

  /* controls */
  .ctrl { display:flex; align-items:center; gap: 8px; }
  .seg { display:flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .seg button { background: transparent; border: 0; padding: 5px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); }
  .seg button.sel { background: var(--panel2); color: var(--strong); box-shadow: inset 0 0 0 1px var(--line); }
  .range { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .grow { flex: 1; }
  .legend { display:flex; gap: 6px; flex-wrap: wrap; }
  .lg { display:flex; align-items:center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; font-size: 12px; background: var(--panel); }
  .lg i { width: 10px; height: 10px; border-radius: 3px; display:inline-block; }
  .lg.off { opacity: .35; text-decoration: line-through; }

  /* timeline */
  .tlwrap { flex: 1; display:flex; min-height: 0; gap: 12px; }
  .tl { flex: 1; position: relative; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  #app[data-theme="old"] .tl { background: transparent; border: 0; border-radius: 0; }
  .axis { position:absolute; left:0; right:0; top:0; height: 30px; border-bottom: 1px solid var(--line); }
  #app[data-theme="old"] .axis { border-bottom: 0; }
  .axis span { position:absolute; top: 8px; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
  .axis span.major { color: var(--accent); font-weight: 700; }
  .gridline { position:absolute; top: 30px; bottom: 0; width: 1px; background: var(--grid); }
  .nowline { position:absolute; top: 22px; bottom: 0; width: 2px; background: var(--now); z-index: 3; }
  .nowtag { position:absolute; top: 4px; transform: translateX(-50%); background: var(--now); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 4px; z-index: 4; }
  .rows { position:absolute; left:0; right:0; top: 30px; bottom: 0; overflow: hidden; }
  .row { position:absolute; left:0; right:0; }
  .row.alt { background: rgba(127,127,127,.04); }
  .namecol { position:absolute; left:0; top:0; bottom:0; display:flex; align-items:center; gap: 8px; padding-left: 12px; border-right: 1px solid var(--line); background: var(--panel); z-index: 2; }
  .namecol img { width: 22px; height: 22px; border-radius: 11px; }
  .namecol .nm { color: var(--strong); font-weight: 600; }
  .namecol .sub { color: var(--muted); font-size: 11px; margin-left: auto; padding-right: 10px; }
  .namecol .on { width: 7px; height: 7px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .bar { position:absolute; border-radius: 4px; cursor: default; }
  #app[data-theme="old"] .bar { border-radius: 0; opacity: .6; }
  .bar.online { box-shadow: 0 0 10px var(--accent), inset 0 0 0 1px var(--accent); opacity: 1 !important; }
  .bar:hover { filter: brightness(1.35); }
  .flabel { position:absolute; display:flex; align-items:center; gap: 6px; white-space: nowrap; font-size: 12px; color: #c8c8c8; pointer-events: none; }
  .flabel img { width: 20px; height: 20px; border-radius: 10px; }
  .flabel.on { color: var(--accent); }
  .flabel.small { font-size: 11px; color: var(--muted); }
  .flabel.small.on { color: var(--accent); }
  .dbg { position:absolute; left: 6px; top: 34px; color: #777; font-size: 12px; z-index: 2; }

  /* right panel */
  .rpanel { width: 240px; flex: 0 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow: auto; }
  .rpanel h4 { margin: 0 0 10px; color: var(--strong); font-size: 13px; display:flex; align-items:center; gap: 6px; }
  .rpanel .ch { margin-bottom: 12px; }
  .rpanel .ch .cn { display:flex; align-items:center; gap: 6px; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .rpanel .ch .cn i { width: 10px; height: 10px; border-radius: 3px; }
  .rpanel .mem { display:flex; align-items:center; gap: 8px; padding: 3px 0; color: var(--strong); }
  .rpanel .mem img { width: 20px; height: 20px; border-radius: 10px; }
  .rpanel .mem span { margin-left:auto; color: var(--muted); font-size: 11px; }

  /* session tooltips */
  .stip { position:absolute; z-index: 30; pointer-events: none; }
  .stip.old { background: rgba(0,0,0,.85); color: #fff; padding: 10px; width: 240px; font-size: 12px; line-height: 24px; }
  .stip.old .u { display:flex; align-items:center; gap: 8px; font-size: 13px; }
  .stip.old .u img { width: 24px; height: 24px; border-radius: 12px; }
  .stip.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 250px; box-shadow: 0 12px 30px rgba(0,0,0,.35); color: var(--text); }
  .stip.card .u { display:flex; align-items:center; gap: 10px; color: var(--strong); font-weight: 700; font-size: 14px; }
  .stip.card .u img { width: 30px; height: 30px; border-radius: 15px; }
  .stip.card .chn { display:inline-flex; align-items:center; gap: 6px; margin: 10px 0 8px; padding: 2px 8px; border-radius: 6px; font-size: 12px; color: #fff; }
  .stip.card .ln { display:flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
  .stip.card .ln b { color: var(--strong); font-weight: 600; }
  .stip.card .tot { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; font-size: 12px; color: var(--muted); }

  /* loading */
  .loadbar { position:absolute; left:0; top:0; height: 5px; background: #5bffce; z-index: 50; transition: width .2s; }
  .sk { background: linear-gradient(90deg, var(--panel2) 0%, var(--line) 50%, var(--panel2) 100%); background-size: 200% 100%; animation: sk 1.1s infinite linear; border-radius: 6px; }
  @keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  .toast { position:absolute; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--strong); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-weight: 600; z-index: 60; }

  /* person page */
  .namecol.link { cursor: pointer; } .namecol.link:hover .nm { text-decoration: underline; }
  .back { color: var(--muted); cursor: pointer; font-size: 12px; display:inline-flex; gap: 6px; align-items:center; align-self: flex-start; }
  .back:hover { color: var(--strong); }
  .uhead { display:flex; align-items:center; gap: 14px; }
  .uhead img { width: 52px; height: 52px; border-radius: 26px; }
  .uhead .nm { font-size: 24px; font-weight: 800; color: var(--strong); display:flex; align-items:center; gap: 10px; }
  .uhead .st { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .uhead .nm .btn { font-size: 12px; font-weight: 500; }
  .pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgba(61,220,151,.15); color: var(--accent); }
  .pill.off { background: var(--panel2); color: var(--muted); }
  .grid2 { display:grid; grid-template-columns: 1.4fr 1fr; gap: 12px; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .card h5 { margin: 0 0 10px; font-size: 13px; color: var(--strong); display:flex; align-items:center; gap: 8px; }
  .card h5 span { color: var(--muted); font-weight: 400; font-size: 11px; }
  .hbars { display:flex; align-items:flex-end; gap: 3px; height: 120px; }
  .hbars div { flex: 1; background: var(--accent2); border-radius: 3px 3px 0 0; opacity: .85; }
  .hbars div.cur { background: var(--now); opacity: 1; }
  .hlabels { display:flex; gap: 3px; margin-top: 4px; } .hlabels span { flex: 1; text-align: center; font-size: 10px; color: var(--muted); }
  .heat { display:grid; grid-template-columns: 22px repeat(24, 1fr); gap: 2px; font-size: 10px; color: var(--muted); }
  .heat i { height: 13px; border-radius: 2px; background: var(--accent2); }
  .dbars { display:flex; align-items:flex-end; gap: 4px; height: 90px; }
  .dbars div { flex: 1; background: var(--accent2); border-radius: 3px 3px 0 0; opacity: .7; }
  .chrow { display:flex; align-items:center; gap: 8px; margin: 6px 0; font-size: 12px; }
  .chrow .bx { flex: 1; height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; } .chrow .bx i { display:block; height: 100%; }
  .chrow b { width: 70px; color: var(--strong); font-weight: 600; } .chrow span { width: 40px; text-align: right; color: var(--muted); }
  .slist { font-size: 12px; } .slist div { display:flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); } .slist div:last-child { border: 0; }
  .slist i { width: 8px; height: 8px; border-radius: 4px; margin-top: 4px; flex: 0 0 auto; } .slist .t { color: var(--muted); width: 120px; } .slist .d { margin-left: auto; color: var(--strong); }
  .upanel { position:absolute; right: 0; top: 0; bottom: 0; width: 330px; background: var(--panel); border-left: 1px solid var(--line); z-index: 20; padding: 18px; display:flex; flex-direction:column; gap: 12px; box-shadow: -12px 0 30px rgba(0,0,0,.35); }
  .upanel .x { position:absolute; right: 14px; top: 12px; cursor: pointer; color: var(--muted); font-size: 18px; }

  /* ranking */
  .stabs { display:flex; gap: 2px; border-bottom: 1px solid var(--line); }
  .stabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 14px 9px; color: var(--muted); cursor: pointer; font-weight: 600; }
  .stabs button.sel { color: var(--strong); border-color: var(--accent); }
  .boards { display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px; flex: 1; min-height: 0; }
  .lb { display:flex; flex-direction:column; }
  .lb .r { display:flex; align-items:center; gap: 9px; padding: 6px 4px; border-radius: 6px; cursor: pointer; }
  .lb .r:hover { background: var(--panel2); }
  .lb .r .no { width: 20px; text-align:center; font-weight: 800; color: var(--muted); }
  .lb .r .no.m1 { color: #f5c542; } .lb .r .no.m2 { color: #c9d1db; } .lb .r .no.m3 { color: #d39360; }
  .lb .r img { width: 24px; height: 24px; border-radius: 12px; }
  .lb .r .nm { color: var(--strong); font-weight: 600; min-width: 46px; }
  .lb .r .bar2 { flex: 1; height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; } .lb .r .bar2 i { display:block; height: 100%; background: var(--accent2); }
  .lb .r .val { width: 86px; text-align: right; color: var(--strong); font-variant-numeric: tabular-nums; }
  .lb .note { color: var(--muted); font-size: 11px; margin-top: auto; padding-top: 6px; }
  table.rt { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.rt th { text-align: right; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
  table.rt th:nth-child(-n+2) { text-align: left; }
  table.rt th.sel { color: var(--accent); }
  table.rt td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--line); color: var(--text); font-variant-numeric: tabular-nums; }
  table.rt td:nth-child(-n+2) { text-align: left; }
  table.rt td.sel { color: var(--strong); font-weight: 700; }
  table.rt tr { cursor: pointer; } table.rt tbody tr:hover { background: var(--panel2); }
  .rkpanel { width: 280px; flex: 0 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display:flex; flex-direction:column; gap: 8px; overflow: hidden; }
  .rkpanel h4 { margin: 0; color: var(--strong); font-size: 13px; }
  .rkchips { display:flex; flex-wrap: wrap; gap: 4px; }
  .rkchips span { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; color: var(--muted); }
  .rkchips span.sel { color: var(--strong); border-color: var(--accent); background: var(--panel2); }
  .rankpill { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: rgba(245,197,66,.15); color: #f5c542; margin-left: 6px; vertical-align: middle; }

  /* ---------- feedback round 1 ---------- */
  .content { overflow-y: auto; }
  .back.btn2 { font-size: 13px; font-weight: 600; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px 6px 9px; }
  .back.btn2 .ar { font-size: 16px; line-height: 1; }
  .back.btn2:hover { background: var(--panel2); }
  .back.big { font-size: 14px; font-weight: 600; color: var(--text); }
  .back.big .ar { font-size: 18px; line-height: 1; }
  .rail .srv .live.big { right: -6px; bottom: -6px; min-width: 24px; height: 24px; border-radius: 12px; font-size: 13px; font-weight: 800; padding: 0 4px; }
  .rail .srv .livebelow { display:flex; align-items:center; justify-content:center; gap: 4px; margin-top: 4px; font-size: 12px; font-weight: 800; color: var(--accent); }
  .fwrap { position: relative; }
  .fwrap.fill { flex: 1; min-height: 110px; display:flex; flex-direction:column; }
  .fwrap.fill svg { flex: 1; height: auto !important; min-height: 0; }
  .fguide { position:absolute; top: 0; width: 1px; background: var(--strong); opacity: .6; pointer-events: none; }
  .fnow { position:absolute; top: -2px; transform: translateX(-50%); background: var(--now); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 4px; pointer-events: none; white-space: nowrap; }
  .ftip { position:absolute; z-index: 30; pointer-events: none; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px; color: var(--text); white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .ftip b { color: var(--strong); font-size: 13px; }
  .heat.fill { flex: 1; grid-auto-rows: 1fr; min-height: 90px; }
  .heat.fill i { height: auto; }
  .heat span { display:flex; align-items:center; }
  .heat i.hv { outline: 2px solid var(--strong); outline-offset: -1px; }
  .grass { display:grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
  .grass i { width: 100%; aspect-ratio: 1; border-radius: 2px; background: var(--accent2); }
  .grass i.empty { background: var(--panel2); opacity: 1 !important; }
  .grasswrap { display:grid; grid-template-columns: 22px 1fr; gap: 4px; font-size: 10px; color: var(--muted); }

<script>
/* ================= synthetic data (no real users) ================= */
const NOW = Date.now();
const H = 3600e3, D = 24 * H;
const sod = (t = NOW) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
let seed = 42;
const rand = () => ((seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648);
const pick = (a) => a[Math.floor(rand() * a.length)];
const av = (name, hue) => "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="hsl(${hue},55%,45%)"/><text x="32" y="42" font-size="28" text-anchor="middle" fill="white" font-family="sans-serif">${name[0]}</text></svg>`);
const GDEF = [
  { id: "g1", name: "쿠션 클랜", channels: ["일반", "롤 내전 1", "롤 내전 2", "발로란트", "잠수방"], n: 14 },
  { id: "g2", name: "스터디 모임", channels: ["모각코", "회의실", "잡담"], n: 7 },
  { id: "g3", name: "주말 게임단", channels: ["배그", "오버워치", "로비"], n: 9 },
];
const NAMES = ["민준", "서연", "도윤", "하은", "지호", "수아", "예준", "지유", "시우", "채원", "주원", "다은", "건우", "유나", "현우", "소윤", "우진", "가은"];
const GUILDS = GDEF.map((g, gi) => {
  const users = [];
  for (let u = 0; u < g.n; u++) {
    const name = NAMES[(u + gi * 5) % NAMES.length];
    const sessions = [];
    const pref = [21, 22, 20, 23, 14, 19, 1, 16][(u + gi) % 8]; // favourite hour
    const activity = 0.35 + rand() * 0.5;
    const bouncy = ((u * 37 + gi * 11) % 10) / 10; // how often this person pops in and out
    for (let day = 364; day >= 0; day--) {
      const base = sod(NOW - day * D);
      const weekend = [0, 6].includes(new Date(base).getDay());
      const dayS = [];
      if (rand() <= activity + (weekend ? 0.2 : 0)) {
        const count = rand() < 0.3 ? 2 : 1;
        for (let k = 0; k < count; k++) {
          const st = base + (pref + (rand() - 0.5) * 6 + k * 3) * H;
          dayS.push({ s: st, e: st + (20 + rand() * 200) * 60e3 });
        }
      }
      if (rand() < bouncy * 0.7) {
        const n = 1 + Math.floor(rand() * 3);
        for (let k = 0; k < n; k++) { const st = base + (pref + (rand() - 0.5) * 9) * H; dayS.push({ s: st, e: st + (0.3 + rand() * 4.2) * 60e3 }); }
      }
      dayS.sort((x, y) => x.s - y.s);
      for (const x of dayS) {
        if (x.s > NOW) continue;
        if (sessions.length && sessions.at(-1).e > x.s) continue;
        const online = x.e > NOW;
        sessions.push({ ch: pick(g.channels), s: Math.round(x.s), e: online ? NOW : Math.round(x.e), online });
      }
    }
    // bouncy people also popped in and out today
    if (bouncy >= 0.5) {
      for (let k = 0; k < 2; k++) {
        const st = NOW - (1 + rand() * 7) * H, en = st + (0.5 + rand() * 3) * 60e3;
        if (!sessions.some((x) => x.s < en + 60e3 && x.e > st - 60e3)) sessions.push({ ch: pick(g.channels), s: Math.round(st), e: Math.round(en), online: false });
      }
      sessions.sort((x, y) => x.s - y.s);
    }
    // a few people are online right now
    const last = sessions.at(-1);
    if (u % 3 === 0 && (!last || !last.online)) {
      const st = NOW - (25 + rand() * 140) * 60e3;
      if (!last || last.e < st) sessions.push({ ch: g.channels[u % 2 === 0 ? 0 : 1], s: Math.round(st), e: NOW, online: true });
    }
    users.push({ id: `${g.id}u${u}`, name, avatar: av(name, (u * 47 + gi * 30) % 360), sessions });
  }
  return { ...g, icon: av(g.name, gi * 120 + 160), members: 40 + gi * 17, users };
});
const HUES = [150, 4, 212, 280, 42, 180];
const hueOf = (ch) => { for (const g of GDEF) { const i = g.channels.indexOf(ch); if (i >= 0) return HUES[i % HUES.length]; } return 0; };
const chColor = (ch) => `hsl(${hueOf(ch)}, var(--barS), var(--barL))`;
const chSolid = (ch) => `hsl(${hueOf(ch)}, 55%, 45%)`;
const fmtDur = (ms) => { const m = Math.round(ms / 60e3); const h = Math.floor(m / 60); return h ? `${h}시간 ${m % 60}분` : `${m}분`; };
const p2 = (n) => String(n).padStart(2, "0");
const fmtHM = (t) => { const d = new Date(t); return `${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const fmtFull = (t) => { const d = new Date(t); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const isOnline = (u) => u.sessions.some((s) => s.online);
function todayStats(g) {
  const s0 = sod();
  let total = 0, people = 0, best = null;
  for (const u of g.users) {
    let ut = 0;
    for (const s of u.sessions) { const a = Math.max(s.s, s0), b = Math.min(s.e, NOW); if (b > a) ut += b - a; }
    if (ut > 0) people++;
    total += ut;
    if (!best || ut > best.t) best = { u, t: ut };
  }
  return { total, people, best, online: g.users.filter(isOnline).length };
}
function concurrency(g, from, to, steps = 120) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = from + ((to - from) * i) / steps;
    pts.push(g.users.reduce((a, u) => a + (u.sessions.some((s) => s.s <= t && t <= s.e) ? 1 : 0), 0));
  }
  return pts;
}
function sparkSvg(g, w, h, color) {
  const pts = concurrency(g, sod(), NOW, 96);
  const max = Math.max(1, ...pts);
  const d = pts.map((v, i) => `${i === 0 ? "M" : "L"}${((i / (pts.length - 1)) * w).toFixed(1)},${(h - (v / max) * (h - 4) - 2).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}"><path d="${d} L${w},${h} L0,${h} Z" fill="${color}" opacity=".25"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6"/></svg>`;
}

/* ================= decision items ================= */
const ITEMS = [

    { id: "old", name: "기존", desc: "왼쪽 280px 사이드바에 서버 카드 + 오늘 접속 그래프", old: 1 },
    { id: "rail", name: "아이콘 레일", desc: "디스코드처럼 왼쪽 좁은 아이콘 줄. 타임라인이 넓어지고 지금 접속 수 배지 표시", rec: 1 },
    { id: "tabs", name: "상단 탭", desc: "서버를 위쪽 탭으로 전환. 왼쪽 공간을 전부 타임라인에 씀" } ] },
  { key: "rows", title: "타임라인 행 표시", opts: [
    { id: "old", name: "기존", desc: "막대 뒤에 이름이 매번 붙음. 이름 열 없음", old: 1 },
    { id: "fixed", name: "고정 이름 열", desc: "왼쪽에 아바타·이름·접속 상태·오늘 시간 고정, 오른쪽은 막대만", rec: 1 },
    { id: "compact", name: "고정 이름 열 (촘촘)", desc: "같은 구조에 행 높이를 줄여 한 화면에 더 많은 사람" } ] },
  { key: "ctrl", title: "기간·확대 조작", opts: [

    { id: "seg", name: "기간 프리셋", desc: "[최근 24시간 | 오늘 | 최근 7일] 선택 + 지금으로 + 확대/축소, 기간 글자는 작게", rec: 1 } ] },

function curRange() { return rangeOf(); }

const ease = (t) => 1 - Math.pow(1 - t, 3);

app.addEventListener("wheel", (e) => {

  const rect = tl.getBoundingClientRect(); const x = e.clientX - rect.left; if (x < NCW()) return;
  e.preventDefault();
  const W = rect.width, NC = NCW(), bw = W - NC - 24;
  const [ra, rb] = anim ? anim.to : curRange();
  const span = rb - ra, minSpan = MINSPAN[state.zoom];

  const at = ra + ((x - NC - 12) / bw) * span, r = (at - ra) / span;

  const dur = state.wheelease === "fast" ? 150 : 300;
  const running = !!anim;

    if (!moved) return;

  if (key === "barradius" && opt !== "all") { view.page = "user"; view.user = ranked(G(), "total", "all")[0].u.id; }
  if (key === "barradius" && opt === "all") { view.page = "server"; view.tab = "timeline"; view.preset = "24h"; view.zoom = 1; view.center = null; }
  if (["backsize", "ufill", "fcur"].includes(key)) { if (view.page !== "user") { view.page = "user"; view.user = ranked(G(), "total", "all")[0].u.id; } }
  if (key === "badge") { view.page = "server"; view.tab = "timeline"; }
  if (key === "zoom") {
    view.page = "server"; view.tab = "timeline"; view.preset = "24h";
    const u = G().users.find((x) => x.sessions.some((s) => s.online)); const s0 = u.sessions.find((s) => s.online).s;
    view.center = s0 + MINSPAN[state.zoom] * 0.3; view.zoom = 1; view.zoom = minZoom();
  }
  if (["sstats", "sfreq", "grass", "scards"].includes(key)) { view.page = "server"; view.tab = state.sstats === "tab" ? "stats" : state.sstats === "rank" ? "rank" : "timeline"; view.rfull = null; }
  if (key === "loading" && changed) playLoading(); else render();
  const ta = list.querySelector("textarea");
  if (ta && focus) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); ta.closest(".opt").scrollIntoView({ block: "nearest" }); }
}
list.addEventListener("click", (e) => {
  if (e.target.tagName === "TEXTAREA") return;
  const o = e.target.closest(".opt"); if (!o) return;
  choose(o.dataset.k, o.dataset.o);
});
list.addEventListener("input", (e) => {
  if (e.target.tagName !== "TEXTAREA") return;
  (comments[e.target.dataset.k] ??= {})[e.target.dataset.o] = e.target.value; autosize(e.target);
});
document.getElementById("copy").onclick = async () => {
  const lines = ["[watcher 모바일 시안 결과]"];
  for (const it of OPEN_ITEMS) {
    const o = it.opts.find((x) => x.id === state[it.key]);
    const c = comments[it.key]?.[o.id]?.trim();
    lines.push(`- ${it.title}: ${o.name}${c ? ` — 의견: ${c.replace(/\n/g, " / ")}` : ""}`);
  }
  const text = lines.join("\n");
  try { await navigator.clipboard.writeText(text); } catch { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  const c = document.getElementById("copied"); c.style.display = "inline"; setTimeout(() => (c.style.display = "none"), 1500);
};
const sw = document.getElementById("newsw");
sw.onclick = () => { sw.classList.toggle("on"); document.body.classList.toggle("shownew", sw.classList.contains("on")); };

/* ================= shift + candidate tooltip ================= */
const ctip = document.getElementById("ctip");
let ctipKey = null;
document.addEventListener("keydown", (e) => { if (e.key === "Shift") document.body.classList.add("shift"); if (e.key === "Escape") closeTip(); });
document.addEventListener("keyup", (e) => { if (e.key === "Shift") document.body.classList.remove("shift"); });
window.addEventListener("blur", () => document.body.classList.remove("shift"));
function closeTip() { ctip.style.display = "none"; ctipKey = null; }
function openTip(key, x, y) {
  const it = ITEMS.find((i) => i.key === key);
  ctipKey = key;
  ctip.innerHTML = `<div class="t">${it.title}</div>${it.opts.map((o) => `<div class="o ${state[key] === o.id ? "cur" : ""}" data-o="${o.id}"><div class="n">${o.name}${o.old && o.name !== "기존" ? `<span class="badge old">기존</span>` : ""}${o.rec ? `<span class="badge rec">추천</span>` : ""}</div><div class="d">${o.desc}</div></div>`).join("")}`;
  ctip.style.display = "block";
  const w = 300, h = ctip.offsetHeight;
  ctip.style.left = Math.min(x + 6, innerWidth - w - 8) + "px";
  ctip.style.top = Math.min(y + 6, innerHeight - h - 8) + "px";
}
document.addEventListener("mousemove", (e) => {
  if (!e.shiftKey) return;
  if (ctip.contains(e.target)) return;
  const c = e.target.closest("[data-cand]");
  if (!c) return;
  const key = c.dataset.cand;
  if (key !== ctipKey) openTip(key, e.clientX, e.clientY);
});
ctip.addEventListener("click", (e) => {
  const o = e.target.closest(".o"); if (!o) return;
  choose(ctipKey, o.dataset.o, false);
  openTip(ctipKey, parseFloat(ctip.style.left) - 6, parseFloat(ctip.style.top) - 6);
});
document.addEventListener("mousedown", (e) => { if (ctip.style.display === "block" && !ctip.contains(e.target) && !e.shiftKey) closeTip(); });

renderNote();
playLoading();
setInterval(() => { if (!view.loading && !view.hover) render(); }, 30000);
</script>
